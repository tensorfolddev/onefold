# Local Postgres for development and the server tests: `npm run db:up` (stop with `npm run db:down`).
# Dev-only credentials — staging and production have their own, set on the VPS.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: onefold_admin
      POSTGRES_PASSWORD: dev-only-admin-password
      POSTGRES_DB: onefold
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - onefold-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onefold_admin -d onefold"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  onefold-dev-db:
