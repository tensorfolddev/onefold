name: ci

# Every pull request into dev, stg or prod — and every merge — must pass these before it can land.
on:
  pull_request:
    branches: [dev, stg, prod]
  push:
    branches: [dev, stg, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each job gets a throwaway Postgres (CI-only credentials; it's gone when the job ends).
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onefold_admin
          POSTGRES_PASSWORD: ci-only-admin-password
          POSTGRES_DB: onefold
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U onefold_admin -d onefold" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_ADMIN_URL: postgres://onefold_admin:ci-only-admin-password@127.0.0.1:5433/onefold
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check # type check + lint + all tests (unit and real-database)
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: onefold_admin
          POSTGRES_PASSWORD: ci-only-admin-password
          POSTGRES_DB: onefold
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U onefold_admin -d onefold" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      NEXT_PUBLIC_APP_ENV: dev
      APP_URL: http://localhost:3100
      DATABASE_ADMIN_URL: postgres://onefold_admin:ci-only-admin-password@127.0.0.1:5433/onefold
      DATABASE_URL: postgres://onefold_web:ci-only-web-password@127.0.0.1:5433/onefold
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: echo "SESSION_SECRET=$(openssl rand -base64 36)" >> "$GITHUB_ENV" # fresh each run
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright test # uses the runner's installed Chrome
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
