name: deploy

# When the promote bot moves stg or prod, build that environment's image (tagged <env>-<commit>) and release it on the
# VPS: deploy/deploy.sh backs up, migrates, switches, checks health and rolls back by itself if the new one is sick.
# Re-deploy or roll back by hand: Actions → deploy → Run workflow (environment + an older commit).
#
# Needs, per GitHub environment ("stg", "prod"): variable DEPLOY_HOST, secrets DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS —
# and on each environment, "Deployment branches" limited to its own branch (prod → prod, stg → stg), with a required
# reviewer on prod, so a workflow edited on another branch can never reach those secrets.
# Until the repository variable DEPLOY_ENABLED is "true" (no server yet), images are built but nothing is deployed.
# With the repository variable STG_ENABLED = "false", staging is switched off: moving stg builds and releases nothing
# (the release path still goes dev → stg → prod; only production is installed).
on:
  push:
    branches: [stg, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        type: choice
        options: [stg, prod]
      commit:
        description: Commit to release (empty = the branch's latest)
        required: false
        type: string

concurrency:
  group: deploy-${{ inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: image
    if: (inputs.environment || github.ref_name) != 'stg' || vars.STG_ENABLED != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      env: ${{ steps.target.outputs.env }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || inputs.environment || github.sha }}
          fetch-depth: 0
      - id: target
        name: Which environment and commit
        env:
          ENV_NAME: ${{ inputs.environment || github.ref_name }}
        run: |
          case "$ENV_NAME" in stg|prod) ;; *) echo "::error::only stg and prod deploy"; exit 1 ;; esac
          # Only what has been released to that branch (now or before — a rollback) can go to that environment.
          git fetch --quiet origin "$ENV_NAME"
          if ! git merge-base --is-ancestor HEAD "origin/$ENV_NAME"; then
            echo "::error::$(git rev-parse --short HEAD) isn't on $ENV_NAME — release it with the promote bot first"
            exit 1
          fi
          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.target.outputs.image }}:${{ steps.target.outputs.env }}-${{ steps.target.outputs.sha }}
          build-args: |
            APP_ENV=${{ steps.target.outputs.env }}
            GIT_SHA=${{ steps.target.outputs.sha }}
          cache-from: type=gha,scope=${{ steps.target.outputs.env }}
          cache-to: type=gha,mode=max,scope=${{ steps.target.outputs.env }}

  release:
    name: release
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.image.outputs.env }}
    steps:
      - name: Release on the VPS
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ENV_NAME: ${{ needs.image.outputs.env }}
          SHA: ${{ needs.image.outputs.sha }}
        run: |
          if [ -z "$HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Set DEPLOY_HOST (variable), DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (secrets) on the '$ENV_NAME' environment"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key may only run deploy/ssh-entry.sh (setup.sh pins it), which runs deploy.sh detached and streams it.
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 onefold@"$HOST" "deploy $ENV_NAME $SHA"
